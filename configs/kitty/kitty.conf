font_family Consolas
bold_font auto
italic_font auto
bold_italic_font auto

# Material Theme Darker matching VS Code
foreground #c6c6c6
background #191919
cursor     #82aaff
cursor_text_color #131313

# Selection
selection_foreground #ffffff
selection_background #242424

# Black
color0 #545454
color8 #737373

# Red
color1 #f07178
color9 #f07178

# Green
color2  #c3e88d
color10 #c3e88d

# Yellow
color3  #ffcb6b
color11 #ffcb6b

# Blue
color4  #82aaff
color12 #3b8eea

# Magenta
color5  #c792ea
color13 #c792ea

# Cyan
color6  #abdcfd
color14 #abdcfd

# White
color7  #c6c6c6
color15 #e5e5e5

# Transparency
background_opacity 0.8
window_padding_width 8
shell zsh

# Enable remote control so Nono can automatically fetch terminal scrollback context
allow_remote_control yes

# Unmap ctrl+shift+t to pass it to the program running inside (e.g. micro)
map ctrl+shift+t no_op

# Map ctrl+t to open a new kitty tab
map ctrl+t new_tab_with_cwd

# Tab bar configuration
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{title}"
tab_bar_margin_height 2.0 0.0


# Tab bar colors with transparent inactive tabs and #242424 active background
active_tab_foreground   #ffffff
active_tab_background   #242424
active_tab_font_style   normal
inactive_tab_foreground #737373
inactive_tab_background #191919
inactive_tab_font_style normal
tab_bar_background      none